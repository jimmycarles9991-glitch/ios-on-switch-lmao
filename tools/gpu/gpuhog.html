<!doctype html>
<!--
  GPU hog and hang for the compositor-priority and recovery checks (debug only, never shipped). Safari's WebGL runs in
  WebKit's GPU process, an app channel like any other, while backboardd composites on its own:
    ?ms=18      one full-screen draw per frame that runs about that long (Maps' resolve draw was 15-18 ms)
    ?hang=1     one draw that never ends: the kernel kills WebKit's channel and WebGL loses its context
  Serve it from the Mac (python3 -m http.server -d tools/gpu) and open http://<mac>:8000/gpuhog.html on the Switch.
-->
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px -apple-system, sans-serif; }
canvas { width: 100%; height: 100%; display: block; }
#line { position: fixed; top: 8px; left: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<script>
const q = new URLSearchParams(location.search);
const hang = q.get('hang') === '1';
let iters = Number(q.get('iters') || 2000);
const target = Number(q.get('ms') || 18);
const canvas = document.getElementById('c');
const line = document.getElementById('line');
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
const gl = canvas.getContext('webgl2');
canvas.addEventListener('webglcontextlost', e => { line.textContent = 'context lost: the GPU killed this page\'s channel'; e.preventDefault(); });
const vs = `#version 300 es
layout(location = 0) in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
// u_stop is 0: the compiler cannot prove the hang loop ends, and every pass feeds the output so it cannot drop the loop
const fs = `#version 300 es
precision highp float;
uniform int u_iters; uniform float u_stop, u_t; out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy * 0.001; float a = u_t;
  ${hang ? 'while (u_stop < 0.5) { a = fract(sin(a + uv.x) * 43758.5453); if (a > 2.0) break; }'
         : 'for (int i = 0; i < u_iters; i++) a = fract(sin(a + uv.x + uv.y) * 43758.5453);'}
  o = vec4(a, uv, 1.0);
}`;
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uIters = gl.getUniformLocation(prog, 'u_iters'), uStop = gl.getUniformLocation(prog, 'u_stop'),
  uT = gl.getUniformLocation(prog, 'u_t');
const px = new Uint8Array(4);
function frame(t) {
  gl.uniform1i(uIters, iters);
  gl.uniform1f(uStop, 0);
  gl.uniform1f(uT, t * 0.001);
  const start = performance.now();
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (hang) {
    gl.flush();
    return;
  }
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // waits for the draw: its time steers iters
  const ms = performance.now() - start;
  iters = Math.max(1, Math.round(iters * Math.min(2, Math.max(0.5, target / Math.max(ms, 0.1)))));
  line.textContent = `draw ${ms.toFixed(1)} ms (target ${target}), ${iters} iterations`;
  if (!gl.isContextLost())
    requestAnimationFrame(frame);
}
line.textContent = hang ? 'drawing one draw that never ends' : '';
requestAnimationFrame(frame);
</script>
</body>
</html>
