name: image
on:
  workflow_dispatch:
    inputs:
      runner:
        description: The hosted macOS runner label to build on.
        required: false
        default: xcode-27

# Creates a release, so it may write.
permissions:
  contents: write

env:
  # One GitHub release asset may be at most 2 GiB; pack splits anything bigger.
  SPLIT_BYTES: "1572864000" # 1500 MiB

jobs:
  image:
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: image
          upload: true
      # The container is composed for 1 TiB (sparse) and install-ios.bin fits it to the card's partition on the
      # Switch: out/sd's parts are split only because FAT32 caps a file at 4 GiB. No size input anywhere.
      - name: Build the image
        run: |
          # Two halves in one step: the build must be finished before its local caches die, and the compose
          # stage is not stated to run at all without ~27 GiB free (want 13 + stages.FLOOR of 14); a full
          # build on a hosted runner leaves the disk with less. The caches were already uploaded to Actions
          # by the composite action, so deleting them here costs only a slower future run.
          bazel build //:image
          df -h / 2>/dev/null || df -h
          rm -rf ~/Library/Caches/switch-ios-bazel/repository ~/Library/Caches/switch-ios-bazel/disk
          echo "after freeing the build's local caches:"
          df -h / 2>/dev/null || df -h

      - name: Free disk for the compose stage
        run: |
          # image.py's own space rule: composing wants ~27 GiB free (13 besides the 14 GiB floor), and
          # translating again wants ~22 GiB inside the same volume. A finished build leaves a hosted
          # runner's 180 GiB disk with 12. The repository cache is hardlinked into the extracted
          # externals (.bazelrc), so removing it frees nothing; the extracted externals the image run
          # does not consume do free real bytes once their last hardlink link dies with them.
          ob="$(bazel info output_base 2>/dev/null | tail -1)"
          echo "== disk hogs, whole =="
          du -xsh "$ob/external" "$ob/bazel-out" ~/Library/Caches/switch-ios* 2>/dev/null | sort -h || true
          echo "== extracted externals, biggest first =="
          du -xsh "$ob"/external/* 2>/dev/null | sort -h | tail -20 || true
          echo "== simulator runtimes (useless to this build) =="
          xcrun simctl list runtimes --json 2>/dev/null | python3 -c "
          import json, sys
          try:
              for r in json.load(sys.stdin).get('runtimes', []):
                  print(r.get('runtimeIdentifier') or r.get('identifier'))
          except Exception as e:
              print('simctl json did not parse:', e)
          " || true
          xcrun simctl runtime delete --all 2>/dev/null || {
            sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          }
          # The image run's runfiles reach out to: the pip hub, the Xcode repo, the IPSW mods, the Apple
          # crosstool, Mesa. Everything else (LLVM, Rust, arm gcc, Apple OSS tarballs, ...) only fed
          # build actions that are already done; drop their last remaining extraction.
          for d in "$ob"/external/*; do
            n="$(basename "$d")"
            case "$n" in
              *switch_pypi*|*python*|*xcode*|*ipsw*|*rules_python*|*apple_support*|*mesa*|*metal*) continue ;;
            esac
            rm -rf "$d" "$ob/external/@$n.marker"
          done
          echo "== after freeing =="
          df -h /

      - name: Compose, populate and pack the image
        run: |
          bazel run //:image -- --out "$RUNNER_TEMP/sd"
          du -sh "$RUNNER_TEMP/sd"
          find "$RUNNER_TEMP/sd" -type f -exec du -h {} +
          if [ -z "$(find "$RUNNER_TEMP/sd" -name '*.SII.001')" ]; then
            echo "::error::out/sd holds no *.SII.001: nothing to install"
            exit 1
          fi

      - name: Package the output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/sd"
          find . -type f | LC_ALL=C sort | xargs shasum -a 256 > "$RUNNER_TEMP/bundle/SHA256SUMS"

          files="$(find . -type f)"
          while IFS= read -r f; do
            rel="${f#./}"
            # Escape an underscore first ('_' -> '_5F'), then encode each '/' as '__': decoding reverses these
            # in the other order, so a literal '__' in a name can never decode into a directory separator.
            encoded="$(printf '%s' "$rel" | sed -e 's/_/_5F/g' -e 's#/#__#g')"
            size="$(stat -f %z "$f")"
            if [ "$size" -gt "$SPLIT_BYTES" ]; then
              split -a 3 -b 1500m "$f" "$RUNNER_TEMP/bundle/$encoded.part-"
            else
              cp "$f" "$RUNNER_TEMP/bundle/$encoded"
            fi
          done <<EOF
          $files
          EOF

      - name: Bundle reassembly script
        run: |
          cat > "$RUNNER_TEMP/bundle/reassemble.sh" <<'EOS'
          #!/usr/bin/env bash
          # Rebuild the SD tree (out/sd) from this bundle, then optionally merge it onto the card's FAT32 root:
          #   sh reassemble.sh /media/tom/THEDRIVE
          # Nothing here deletes anything already on the card.
          set -eu
          here="$(cd "$(dirname "$0")" && pwd)"
          # The item list is captured before ./sd exists, so the output folder can't join its own copy list.
          items="$(find "$here" -maxdepth 1 -mindepth 1 -type f | LC_ALL=C sort)"
          out="$here/sd"
          mkdir -p "$out"
          while IFS= read -r f; do
            base="$(basename "$f")"
            case "$base" in SHA256SUMS|reassemble.sh) continue ;; esac
            if [[ "$base" =~ ^(.+\.part-)([a-z]{3})$ ]]; then
              stem="${BASH_REMATCH[1]%.part-}" # the pattern's split marker leaves the encoded name
              dest="$(printf '%s' "$stem" | sed -e 's#__#/#g' -e 's/_5F/_/g')"
              dest="$out/$dest"
            else
              stem=""
              dest="$out/$(printf '%s' "$base" | sed -e 's#__#/#g' -e 's/_5F/_/g')"
            fi
            [ -e "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            if [ -n "$stem" ]; then
              cat "$here/$stem.part-"[a-z][a-z][a-z] > "$dest"
            else
              cp "$f" "$dest"
            fi
          done <<< "$items"
          (cd "$out" && sha256sum -c "$here/SHA256SUMS")
          if [ $# -gt 0 ]; then
            cp -a "$out/." "$1/"
          fi
          EOS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-sd-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "iOS SD image ($TAG)" \
            --notes "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: \`bazel run //:image\`. Extract this whole bundle together, run \`sh reassemble.sh <card-mount>\`, then copy \`sd/\`'s contents onto the card's FAT32 root alongside hekate's bootloader." \
            "$RUNNER_TEMP/bundle/reassemble.sh" "$RUNNER_TEMP/bundle/SHA256SUMS"
          for f in "$RUNNER_TEMP/bundle"/*; do
            for i in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber && break || sleep 30
            done
          done
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv'
